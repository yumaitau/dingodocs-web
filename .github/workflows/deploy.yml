name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Restore Wrangler credentials
        env:
          WRANGLER_AUTH_CONFIG: ${{ secrets.WRANGLER_AUTH_CONFIG }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/.wrangler/config"
          printf '%s' "$WRANGLER_AUTH_CONFIG" | base64 -d > "$HOME/.config/.wrangler/config/default.toml"
          chmod 600 "$HOME/.config/.wrangler/config/default.toml"
      - name: Deploy Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Verify production
        run: |
          set -euo pipefail
          curl -fsS --retry 8 --retry-all-errors --retry-delay 3 https://dingodocs.yumait.au/eula | grep -q 'Marketplace EULA URL'
          curl -fsS --retry 8 --retry-all-errors --retry-delay 3 https://dingodocs.yumait.au/refund-policy | grep -q 'Change of mind'
